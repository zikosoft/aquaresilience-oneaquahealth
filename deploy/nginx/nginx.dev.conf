# AquaResilience — local dev reverse proxy (P5, Session 023 user request).
#
# Mirrors the production routing (/ -> frontend, /api/ -> backend) for the
# DEV stack (docker-compose.yml + docker-compose.dev.nginx.yml), so the app
# is reachable on one port (http://localhost) like prod, instead of
# juggling :8080 (frontend) / :8000 (backend) separately.
#
# Not a template (no ${DOMAIN} substitution — pure local dev, always
# "localhost"), so this is mounted straight at /etc/nginx/conf.d/default.conf
# rather than through the templates/envsubst mechanism the prod configs use
# (see nginx.conf.template's own header comment for that mechanism).
#
# Differs from the prod frontend proxying (nginx.conf.template /
# nginx.http.conf.template) in one deliberate way: the dev frontend
# container is Vite's own dev server, not a static build, so its Hot Module
# Replacement websocket has to be forwarded too (Upgrade/Connection
# headers below) — see vite.config.ts's VITE_HMR_CLIENT_PORT for the other
# half of that wiring.

server {
    listen 80;
    server_name localhost;

    client_max_body_size 10m;

    location = /health {
        default_type text/plain;
        return 200 "ok";
    }

    # Backend API — same routing as prod (full path forwarded unchanged).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite dev server (not a static build — see header comment above).
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Long timeout: this is also the HMR websocket's connection, which
        # stays open for the life of the dev session, not a normal request.
        proxy_read_timeout 3600s;
    }
}
