services:
  frontend:
    environment:
      VITE_HMR_CLIENT_PORT: '80'
      # The base dev file hardcodes VITE_API_BASE_URL to
      # http://localhost:8000/api/v1 (correct for the plain :8080/:8000
      # setup) — through this proxy that becomes a cross-origin call
      # (page served from :80, API called on :8000 directly, bypassing
      # nginx entirely) and the backend's dev CORS_ORIGINS doesn't even
      # list port 80, so the browser blocks it with a CORS error. Clearing
      # this to empty makes src/services/api.ts fall back to its own
      # built-in relative default ('/api/v1' — see that file), which nginx
      # then proxies to the backend same-origin, exactly like the
      # production setup already does (see docker-compose.prod.yml's own
      # comment on the same fallback) — no CORS involved at all.
      VITE_API_BASE_URL: ''

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: aquaresilience-reverse-proxy-dev
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - aquaresilience-internal
