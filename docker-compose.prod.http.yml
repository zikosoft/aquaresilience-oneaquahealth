# AquaResilience — HTTP-only override for docker-compose.prod.yml (P5).
#
# Apply this ON TOP OF docker-compose.prod.yml to get the exact same
# production images and hardening (built images, no --reload, no source
# bind-mounts, Postgres/Redis never published) but reachable over plain
# HTTP on port 80 — no certificate, no redirect to HTTPS. Use this for a
# quick demo-subdomain deployment before a real certificate is ready, or
# whenever TLS is already terminated upstream of this server (a CDN or
# load balancer in front of it).
#
# Usage — see DEPLOYMENT.md's "HTTP-only demo deploy" section for the full
# walkthrough with real commands:
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.http.yml \
#     --env-file .env.production up -d --build reverse-proxy backend frontend postgres redis
#
# Deliberately not in that service list: `certbot` (base file) — it only
# matters for the TLS path, so it's simply left out rather than started
# and left idle.
#
# Port 443 stays published by the base file (nothing overridden here) —
# harmless: nothing listens on it with this nginx config, so a connection
# there just gets refused. Left as-is on purpose, rather than touched via
# an override, because Compose concatenates (not replaces) list-type
# `ports` entries across files — overriding it here would risk a stray
# duplicate "80:80" mapping instead of actually removing "443:443".
#
# Switching to TLS later: stop this override (re-run with just
# docker-compose.prod.yml, see DEPLOYMENT.md sections 1/3, including a
# real certificate) — same containers, same data volumes, no rebuild
# needed beyond the reverse-proxy picking up its normal TLS config.

services:
  reverse-proxy:
    volumes:
      # Only this one target path is overridden (swapping in the HTTP-only
      # template) — the base file's other two volume mounts (certs,
      # certbot-webroot) are left alone by Compose's per-target-path merge
      # since they aren't repeated here; they stay mounted but unused.
      - ./deploy/nginx/nginx.http.conf.template:/etc/nginx/templates/default.conf.template:ro

  backend:
    environment:
      # Base file sets this to https://${DOMAIN} (docker-compose.prod.yml)
      # — this deployment is plain HTTP, so the scheme must match or the
      # browser's CORS preflight will reject the frontend's own API calls.
      CORS_ORIGINS: http://${DOMAIN}
