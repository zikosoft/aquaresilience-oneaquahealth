server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Generated at container start; must never be cached.
    location = /runtime-config.js {
        add_header Cache-Control "no-store";
    }

    # Module workers (maplibre-gl) must be served as JavaScript, and a missing
    # file must 404 instead of falling back to index.html.
    location ~* \.mjs$ {
        default_type text/javascript;
        expires 1d;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
